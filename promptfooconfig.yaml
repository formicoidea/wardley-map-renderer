description: 'Wardley API - Evolution score evaluations'

defaultTest:
  options:
    providers:
    - id: file://scripts/claude-eval.mjs
      label: claude-code
  assert:
    # Validation structurelle : le resultat est un nombre entre -1 et 2
    # - type: javascript
    #   metric: 'Valid [-1,2]'
    #   value: |
    #     const raw = output.trim();
    #     const val = parseFloat(raw);
    #     if (isNaN(val)) return { pass: false, score: 0, reason: `Not a number. LLM: "${raw}"` };
    #     if (val < -1 || val > 2) return { pass: false, score: 0, reason: `${val} hors [-1, 2]. LLM: "${raw}"` };
    #     return { pass: true, score: 1, reason: `LLM: ${val}` };
    # Validation de fourchette : le resultat est dans la range attendue
    - type: javascript
      metric: 'In range'
      value: |
        const raw = output.trim();
        const val = parseFloat(raw);
        const min = context.vars.min_evolution;
        const max = context.vars.max_evolution;
        if (val < min || val > max) {
          return { pass: false, score: 0, reason: `${val} hors fourchette [${min}, ${max}]. LLM: "${raw}"` };
        }
        const target = (min + max) / 2;
        const distance = Math.abs(val - target) / (max - min);
        return { pass: true, score: +(1 - distance).toFixed(3), reason: `range [${min}, ${max}] | score: ${(1 - distance).toFixed(3)}` };
    # Validation de zone : social [-1,0), economic [0,1], common (1,2]
    - type: javascript
      metric: 'Zone'
      value: |
        const raw = output.trim();
        const val = parseFloat(raw);
        const expected = context.vars.expected_zone;
        if (!expected) return { pass: true, score: 1, reason: 'No zone check' };
        const zones = { social: val < 0, economic: val >= 0 && val <= 1, common: val > 1 };
        if (zones[expected]) return { pass: true, score: 1, reason: `${expected} zone OK (${val})` };
        const actual = val < 0 ? 'social' : val > 1 ? 'common' : 'economic';
        return { pass: false, score: 0, reason: `Expected ${expected}, got ${actual} (${val})` };

providers:
  - id: https
    label: opencode-zen-kimi-2-5
    config:
      url: 'https://opencode.ai/zen/v1/chat/completions'
      method: 'POST'
      headers:
        'Content-Type': 'application/json'
        'Authorization': 'Bearer {{env.OPENCODE_API_KEY}}'
      body:
        model: 'kimi-k2.5'
        messages:
          - role: 'user'
            content: '{{prompt}}'
      transformResponse: 'json.choices[0].message.content'
  - id: https
    label: opencode-zen-haiku-4-5
    config:
      url: 'https://opencode.ai/zen/v1/messages'
      method: 'POST'
      headers:
        'Content-Type': 'application/json'
        'x-api-key': '{{env.OPENCODE_API_KEY}}'
        'anthropic-version': '2023-06-01'
      body:
        model: 'claude-haiku-4-5'
        max_tokens: 256
        messages:
          - role: 'user'
            content: '{{prompt}}'
      transformResponse: 'json.content[0].text'
  # - id: file://scripts/claude-eval.mjs
  #   label: claude-code

prompts:
  # - label: 'A - Expert economiste'
  #   raw: |
  #     Economic science and history of technics and science have no secret for you.
  #     Given a component name and its business context, return a single decimal number between -1 and 2:
  #     - [-1, 0): Social good - (Social goods enters the economic space through commodification)
  #     - [0, 1]: Economic good - (Economic goods returns to the social good space through social ownership, Economic goods enter the common good space through decommodification)
  #     - (1, 2]: Common good - (Common goods enters the economic space through privatisation)

  #     Component to evaluate: {{component}}
  #     Context: {{context}}
  #     MANDATORY OUTPUT FORMAT: a single decimal number between -1 and 2, with no additional text.

  # - label: 'B - Wardley Mapper expert'
  #   raw: |
  #     You are a Wardley Mapping practitioner with 10 years of experience.
  #     Given a component name and its business context, return a single decimal number between -1 and 2:
  #     - [-1, 0): Social good
  #     - [0, 1]: Economic
  #     - (1, 2]: Common good
  #     Component to evaluate: {{component}}
  #     Context: {{context}}
  #     MANDATORY OUTPUT FORMAT: a single decimal number between -1 and 2, with no additional text.

  - label: 'C - Certitude/Ubiquité directe'
    raw: |
      You are an expert in economic science and technology history.
      For the given component, estimate two values between 0 and 1:
      - certitude: how well-understood and defined the component is (0<=X<0.18: Poorly Understood , 0.18<=X<0.26: Rapid increase in learning,  0.26<=X<0.70: Rapid increases in use / fit for purpose, 0.70<=X<1: Commonly understood (in terms of use))
      - ubiquity: the fact that something seems to be everywhere (0<=Y<0.08: Rare , 0.08<=Y<0.20: Slowly increasing consumption,  0.20<=Y<0.60: Rapidly increasing consumption, 0.60<=Y<1: Widespread and stabilising)

      Component: {{component}}
      Context: {{context}}

      MANDATORY FORMAT: exactly two lines, no additional text:
      certitude=X.XX
      ubiquity=Y.YY

  - label: 'D - Wardley certitude/ubiquité'
    raw: |
      You are an expert in economic science and technology history. Wardley evolution follows an S-curve
      where components move from Genesis to Commodity as their certitude
      (how well understood) and ubiquity (how widespread) increase.

      Estimate these two values between 0 and 1 for the given component:
      Component: {{component}}
      Context: {{context}}

      MANDATORY FORMAT: exactly two lines, no additional text:
      certitude=X.XX
      ubiquity=X.XX

