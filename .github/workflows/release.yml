name: Release (npm)

# Publishes @formicoidea/wardley-map-renderer to the public npm registry when a
# version tag is pushed (e.g. `git tag v1.0.0-beta.5 && git push origin v1.0.0-beta.5`).
#
# Auth is npm trusted publishing (OIDC): no token, no secret. It requires a
# one-time setup on npmjs — package settings → Trusted publishers → this repo +
# this workflow file. Until then, publish manually (see PUBLISHING.md); a tag
# pushed too early only fails this job, it cannot publish anywhere else.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for trusted publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm first so setup-node's pnpm cache has something to key on.
      # Version is read from the "packageManager" field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@formicoidea"
          cache: pnpm

      # Trusted publishing needs a recent npm CLI.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Prerelease versions (1.0.0-beta.5) must NOT claim the `latest` dist-tag.
      # Derive `beta` for any version containing a hyphen, else `latest`.
      - name: Determine npm dist-tag
        id: disttag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under dist-tag '$TAG'"

      # npm (not pnpm): trusted publishing is an npm CLI feature.
      # prepublishOnly rebuilds schema/ and dist/, so the tree is intentionally dirty.
      - name: Publish to npm
        run: npm publish --tag ${{ steps.disttag.outputs.tag }}
